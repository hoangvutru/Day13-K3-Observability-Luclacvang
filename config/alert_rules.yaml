alerts:
  - name: latency_spike
    severity: high
    condition: "p95 latency > 2000 ms over 5 minutes"
    type: symptom-based
    owner: observability-team
    runbook: docs/alerts.md#alert-1
  - name: error_rate_increase
    severity: medium
    condition: "error rate > 2% over 5 minutes"
    type: symptom-based
    owner: api-reliability-team
    runbook: docs/alerts.md#alert-2
  - name: quality_degradation
    severity: medium
    condition: "mean quality_score < 0.75 over 5 minutes"
    type: symptom-based
    owner: ai-quality-team
    runbook: docs/alerts.md#alert-3
