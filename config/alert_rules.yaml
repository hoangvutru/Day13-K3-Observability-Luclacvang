alerts:
  - name: High user-facing latency
    severity: critical
    condition: latency_p95_ms > 3000 for 10m
    type: symptom-based
    owner: ai-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2 for 5m with at least 20 requests
    type: symptom-based
    owner: ai-platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: Quality proxy degradation
    severity: warning
    condition: quality_score_avg < 0.75 for 15m with at least 20 responses
    type: symptom-based
    owner: ai-quality-oncall
    runbook: docs/alerts.md#alert-3
